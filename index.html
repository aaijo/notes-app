<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklists</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d1f" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f2; --fg: #1d1f21; --muted: #6f7378; --line: #e3e1da; --card: #ffffff;
    --accent: #2f7d5b; --on-accent: #ffffff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1d1f; --fg: #ecebe7; --muted: #9a9ea3; --line: #2e3134; --card: #232628; --accent: #5fbf8f; --on-accent: #10261b; --danger: #ef7d74; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  .screen { max-width: 40rem; margin: 0 auto; padding: max(1rem, env(safe-area-inset-top)) 1rem 5rem; }
  header { display: flex; align-items: center; gap: .5rem; margin: .25rem 0 1rem; min-height: 2.75rem; }
  h1 { font-size: 1.5rem; margin: 0; flex: 1; overflow-wrap: anywhere; }
  p { margin: .5rem 0 1rem; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .muted { color: var(--muted); font-size: .9rem; }
  .primary { display: block; width: 100%; padding: .9rem; border-radius: .75rem; background: var(--accent); color: var(--on-accent); font-weight: 600; margin-top: 1rem; }
  .link { color: var(--accent); padding: .5rem 0; font-size: .9rem; }
  .back { font-size: 2rem; line-height: 1; padding: 0 .6rem 0 .1rem; color: var(--muted); }

  /* add forms */
  .add { display: flex; gap: .5rem; margin: .5rem 0 1rem; }
  .add input { flex: 1; min-width: 0; font: inherit; color: inherit; padding: .75rem .9rem; border-radius: .75rem;
               border: 1px solid var(--line); background: var(--card); outline: none; }
  .add input:focus { border-color: var(--accent); }
  .add-btn { width: 3rem; border-radius: .75rem; background: var(--accent); color: var(--on-accent); font-size: 1.5rem; line-height: 1; }

  /* list of checklists */
  .lists, .items { list-style: none; margin: 0; padding: 0; }
  .lists li + li { margin-top: .5rem; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: .35rem .75rem; padding: .85rem 1rem; border-radius: .75rem; background: var(--card); border: 1px solid var(--line); }
  .row-title { font-weight: 600; overflow-wrap: anywhere; }
  .row-meta { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .row .bar { grid-column: 1 / -1; }
  .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .progress { display: flex; align-items: center; gap: .75rem; margin: -.25rem 0 1rem; }
  .progress .bar { flex: 1; }
  .progress small { color: var(--muted); font-variant-numeric: tabular-nums; }
  footer { margin-top: 2rem; }

  /* items */
  .items li { display: flex; align-items: center; gap: .25rem; border-bottom: 1px solid var(--line); min-height: 3rem; }
  .check { display: flex; align-items: center; justify-content: center; width: 2.75rem; height: 3rem; flex: none; cursor: pointer; }
  .check input { width: 1.35rem; height: 1.35rem; accent-color: var(--accent); margin: 0; cursor: pointer; }
  .text { flex: 1; padding: .6rem 0; overflow-wrap: anywhere; cursor: text; }
  .items.done .text { color: var(--muted); text-decoration: line-through; }
  .edit { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--accent); border-radius: .5rem; padding: .45rem .6rem; outline: none; }
  .del { width: 2.75rem; height: 3rem; font-size: 1.5rem; color: var(--danger); flex: none; }
  .done-section { margin-top: 1.25rem; }
  .done-toggle { color: var(--muted); font-size: .95rem; padding: .5rem 0; }

  /* menu */
  .menu { position: relative; }
  .menu summary { list-style: none; font-size: 1.6rem; line-height: 1; padding: .2rem .6rem; color: var(--muted); cursor: pointer; border-radius: .5rem; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu[open] summary { background: var(--card); }
  .menu-items { position: absolute; right: 0; top: 2.6rem; z-index: 10; min-width: 13rem; background: var(--card); border: 1px solid var(--line);
                border-radius: .75rem; box-shadow: 0 8px 24px #0002; overflow: hidden; }
  .menu-items button { display: block; width: 100%; text-align: left; padding: .8rem 1rem; }
  .menu-items button + button { border-top: 1px solid var(--line); }
  .menu-items .danger { color: var(--danger); }

  #toast { position: fixed; left: 50%; bottom: max(1.25rem, env(safe-area-inset-bottom)); transform: translate(-50%, 1rem); opacity: 0;
           background: var(--fg); color: var(--bg); padding: .6rem 1rem; border-radius: .6rem; font-size: .9rem; transition: .25s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
