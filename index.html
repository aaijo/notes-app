<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder access test</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2933">
<style>
  :root { color-scheme: light dark; --ok:#2e7d32; --bad:#c62828; --muted:#6b7280; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1rem; }
  h1 { font-size: 1.3rem; margin: .2rem 0 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: .25rem 0; border-bottom: 1px solid #8883; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  .muted { color: var(--muted); font-size: .9rem; }
  button { font: inherit; padding: .7rem 1rem; margin: .3rem .3rem .3rem 0; border-radius: .5rem;
           border: 1px solid #8886; background: #8881; cursor: pointer; width: 100%; text-align: left; }
  button:disabled { opacity: .4; }
  pre { white-space: pre-wrap; background: #8881; padding: .7rem; border-radius: .5rem; font-size: .85rem; min-height: 3rem; }
</style>
</head>
<body>
<h1>Folder access test</h1>
<p class="muted">Checks whether this browser lets a web app read and write files in a real folder (e.g. a Syncthing folder). Nothing leaves your device.</p>

<h2>1 · What the browser offers</h2>
<ul id="features"></ul>

<h2>2 · Try it</h2>
<button id="pick">📁 Pick a folder and write a test file</button>
<button id="reuse">🔁 Reuse the saved folder (after reloading the page)</button>
<button id="download">⬇️ Fallback: download a Markdown file</button>

<h2>3 · Log</h2>
<pre id="log"></pre>
<button id="copy">📋 Copy log</button>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
function log(msg, cls) {
  const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.textContent += line + '\n';
}

// ---- 1. Feature detection ----
const standalone = matchMedia('(display-mode: standalone)').matches;
const features = [
  ['showDirectoryPicker (pick a folder)', 'showDirectoryPicker' in window],
  ['showSaveFilePicker (save a file)', 'showSaveFilePicker' in window],
  ['showOpenFilePicker (open a file)', 'showOpenFilePicker' in window],
  ['Private browser storage (OPFS)', !!(navigator.storage && navigator.storage.getDirectory)],
  ['Running as installed app', standalone],
];
for (const [name, ok] of features) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span> ${name}`;
  $('features').appendChild(li);
}
log(`User agent: ${navigator.userAgent}`);
log(`Mode: ${standalone ? 'installed app' : 'browser tab'}`);
log(`Features: ` + features.map(([n, ok]) => `${n.split(' ')[0]}=${ok ? 'yes' : 'no'}`).join(', '));
if (!('showDirectoryPicker' in window)) $('pick').disabled = $('reuse').disabled = true;

// ---- Tiny IndexedDB store for the folder handle ----
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('folder-test', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function kvGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const r = db.transaction('kv').objectStore('kv').get(k);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}

// ---- 2. Write, list, read back ----
async function exercise(dir) {
  const name = `pwa-test-${new Date().toISOString().replace(/[:.]/g, '-')}.md`;
  const text = `# Test note\n\nWritten by the folder test at ${new Date().toString()}\nMode: ${standalone ? 'installed app' : 'browser tab'}\n`;
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
  log(`✓ Wrote ${name}`);

  const back = await (await fh.getFile()).text();
  log(back === text ? '✓ Read it back, content matches' : '✗ Read back, but content differs');

  const names = [];
  for await (const [n, h] of dir.entries()) names.push(h.kind === 'directory' ? n + '/' : n);
  log(`✓ Folder "${dir.name}" contains ${names.length} item(s): ${names.slice(0, 15).join(', ')}${names.length > 15 ? ' …' : ''}`);
}

$('pick').onclick = async () => {
  try {
    const dir = await showDirectoryPicker({ mode: 'readwrite', id: 'notes' });
    log(`✓ Picked folder "${dir.name}"`);
    await exercise(dir);
    try { await kvSet('dir', dir); log('✓ Saved folder handle for later'); }
    catch (e) { log(`✗ Could not save handle: ${e.name}: ${e.message}`); }
  } catch (e) {
    log(`✗ ${e.name}: ${e.message}`);
  }
};

$('reuse').onclick = async () => {
  try {
    const dir = await kvGet('dir');
    if (!dir) { log('✗ No saved folder yet — use "Pick a folder" first, then reload.'); return; }
    let perm = await dir.queryPermission({ mode: 'readwrite' });
    log(`Permission on reload: ${perm}`);
    if (perm !== 'granted') {
      perm = await dir.requestPermission({ mode: 'readwrite' });
      log(`Permission after asking: ${perm}`);
    }
    if (perm === 'granted') await exercise(dir);
  } catch (e) {
    log(`✗ ${e.name}: ${e.message}`);
  }
};

$('download').onclick = () => {
  const text = `# Exported note\n\nDownloaded at ${new Date().toString()}\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
  a.download = 'exported-note.md';
  a.click();
  log('Triggered download of exported-note.md — check your Downloads folder.');
};

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(logEl.textContent); log('✓ Log copied'); }
  catch (e) { log(`✗ Copy failed: ${e.message} — select the text manually.`); }
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(
    () => log('✓ Service worker registered (app can be installed)'),
    (e) => log(`✗ Service worker failed: ${e.message}`)
  );
}
</script>
</body>
</html>
